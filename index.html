<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Robot mot Monstre</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- ===== HUD ===== -->
  <div id="hud" class="layer hide">
    <div class="hud-row">
      <div class="hud-box hpbox">
        <span class="ico">&#10084;&#65039;</span>
        <div class="hpbar"><div id="hpFill"></div></div>
        <span id="hpNum">100</span>
        <span id="shieldIco" class="shield-ico hide">&#128737;&#65039;</span>
      </div>
      <div class="hud-box coins"><span class="ico">&#129689;</span><span id="coinCount">0</span></div>
      <div id="boosts" class="boosts"></div>
      <div class="hud-grow">
        <div class="progress"><div id="progressFill"></div><span class="flag">&#128681;</span></div>
      </div>
      <button id="btnPause" class="icon-btn bildeknapp" aria-label="Pause">&#9208;</button>
    </div>
    <div id="bossWrap" class="bosswrap hide">
      <span class="boss-face" id="bossFace">&#128127;</span>
      <div class="bossbar"><div id="bossFill"></div></div>
    </div>
  </div>

  <!-- ===== TOUCH CONTROLS ===== -->
  <div id="touch" class="layer hide">
    <div id="stickZone"></div>
    <div id="stick"><div id="stickKnob"></div></div>
    <div class="pad pad-right">
      <!-- hammer og jetpakke vises foerst naar de er kjoept i butikken -->
      <button id="btnHammer" class="tbtn hammer hide" data-act="hammer" aria-label="Hammer">&#128296;<i class="klar"></i></button>
      <button id="btnJet" class="tbtn jet hide" data-act="jet" aria-label="Jetpakke">&#128640;<i class="tank"><b></b></i></button>
      <button class="tbtn shoot" data-act="shoot" aria-label="Skyt">&#128165;</button>
      <button class="tbtn jump" data-act="jump" aria-label="Hopp">&#11014;</button>
    </div>
  </div>

  <!-- ===== SCREENS ===== -->
  <div id="screens">

    <section id="scrTitle" class="screen hide">
      <div class="title-wrap">
        <canvas id="titleBot" class="bot-preview" width="240" height="260"></canvas>
        <div class="title-text">
          <h1 id="tittel"><img class="logo" src="art/grafikk/logo.png" alt="H&aring;kons Robot mot Monster Spill!"
              onerror="document.getElementById('tittel').classList.add('uten-logo')"><span
              class="t1">ROBOT</span><span class="t2">mot</span><span class="t3">MONSTRE</span></h1>
          <div class="btn-col">
            <button id="btnPlay" class="big-btn green bildeknapp" aria-label="Spill">&#9654; SPILL</button>
            <div class="btn-row">
              <button id="btnScores" class="big-btn small yellow bildeknapp" aria-label="Highscore">&#127942;</button>
              <button id="btnSound" class="big-btn small blue bildeknapp" aria-label="Lyd">&#128266;</button>
              <button id="btnFull" class="big-btn small blue bildeknapp" aria-label="Fullskjerm">&#9974;</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="scrIntro" class="screen hide center">
      <div class="level-card">
        <div class="lvl-label" data-tekst="NIVÅ">NIV&Aring;</div>
        <div id="introNum" class="lvl-num">1</div>
        <div id="introMon" class="lvl-monsters"></div>
      </div>
    </section>

    <section id="scrShop" class="screen hide">
      <div class="shop">
        <div class="shop-head">
          <h2 data-tekst="BUTIKK">BUTIKK</h2>
          <div class="hud-box coins big"><span class="ico">&#129689;</span><span id="shopCoins">0</span></div>
        </div>
        <div class="shop-body">
          <div class="shop-bot">
            <canvas id="shopBot" class="bot-preview" width="240" height="280"></canvas>
            <div class="worth"><span class="ico">&#11088;</span><span id="shopWorth">0</span></div>
          </div>
          <div id="shopGrid" class="shop-grid"></div>
        </div>
        <button id="btnShopGo" class="big-btn green wide bildeknapp" aria-label="Spill">&#9654; SPILL</button>
      </div>
    </section>

    <section id="scrWin" class="screen hide center">
      <div class="panel">
        <div class="big-emoji bildeikon stjerne">&#11088;</div>
        <h2 id="winTitle">BRA!</h2>
        <div class="reward"><span class="ico">&#129689;</span><span id="winCoins">0</span></div>
        <button id="btnWinGo" class="big-btn green wide"><span class="ico">&#128717;</span> <span data-tekst="BUTIKK">BUTIKK</span></button>
      </div>
    </section>

    <section id="scrOver" class="screen hide center">
      <div class="panel">
        <div class="big-emoji bildeikon" id="overEmoji">&#128128;</div>
        <h2 id="overTitle">AU!</h2>
        <div class="worth big"><span class="ico">&#11088;</span><span id="overWorth">0</span></div>
        <div class="name-row">
          <input id="nameInput" maxlength="7" autocomplete="off" spellcheck="false" value="ROBO">
        </div>
        <div class="btn-row">
          <button id="btnAgain" class="big-btn green bildeknapp" aria-label="Igjen">&#128260; IGJEN</button>
          <button id="btnHome" class="big-btn yellow bildeknapp" aria-label="Highscore">&#127942;</button>
        </div>
      </div>
    </section>

    <section id="scrScores" class="screen hide center">
      <div class="panel wide-panel">
        <h2>&#127942; <span data-tekst="BESTE">BESTE</span></h2>
        <ol id="scoreList" class="score-list"></ol>
        <button id="btnScoresBack" class="big-btn blue wide bildeknapp" aria-label="Hjem">&#127968;</button>
      </div>
    </section>

    <section id="scrPause" class="screen hide center">
      <div class="panel">
        <h2 data-tekst="PAUSE">PAUSE</h2>
        <div class="btn-row">
          <button id="btnResume" class="big-btn green bildeknapp" aria-label="Fortsett">&#9654;</button>
          <button id="btnSound2" class="big-btn blue bildeknapp" aria-label="Lyd">&#128266;</button>
          <button id="btnQuit" class="big-btn red bildeknapp" aria-label="Hjem">&#127968;</button>
        </div>
      </div>
    </section>

  </div>

  <div id="rotate" class="hide"><div class="rot-ico">&#128260;</div></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
